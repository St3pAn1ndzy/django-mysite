{% extends 'myauth/base.html' %}

{% block title %}
    Profiles list
{% endblock %}

{% block body %}
    <h1>Profiles</h1>
    {% if object_list %}
        <div>
            {% for profile in object_list %}
                <div>
                    <a href="{% url 'myauth:profile-details' pk=profile.pk %}">Username: {{profile.user.username}}</a>
                </div>
            {% endfor %}
        </div>

    {% else %}
        No profiles yet
    {% endif %}
{% endblock %}
